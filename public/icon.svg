<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#D97706" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle border -->
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#F59E0B" stroke-width="8" stroke-opacity="0.4"/>

  <!-- Star with Drop Shadow -->
  <g filter="url(#glow)">
    <polygon points="256,92 308,198 424,215 340,297 360,412 256,358 152,412 172,297 88,215 204,198" fill="url(#starGrad)"/>
  </g>

  <!-- Little Cute Sparkles -->
  <circle cx="120" cy="130" r="14" fill="#F59E0B"/>
  <circle cx="392" cy="120" r="18" fill="#F59E0B"/>
  <circle cx="410" cy="380" r="12" fill="#EC4899"/>
  <circle cx="102" cy="360" r="10" fill="#EC4899"/>

  <!-- Cute Star Face (eyes & smile) -->
  <circle cx="225" cy="275" r="11" fill="#78350F"/>
  <circle cx="287" cy="275" r="11" fill="#78350F"/>
  <circle cx="222" cy="272" r="3" fill="#FFFFFF"/>
  <circle cx="284" cy="272" r="3" fill="#FFFFFF"/>
  
  <!-- Rosy cheeks -->
  <ellipse cx="205" cy="292" rx="9" ry="5" fill="#F472B6" opacity="0.8"/>
  <ellipse cx="307" cy="292" rx="9" ry="5" fill="#F472B6" opacity="0.8"/>

  <!-- Happy Smile -->
  <path d="M 238 296 Q 256 314 274 296" fill="none" stroke="#78350F" stroke-width="5" stroke-linecap="round"/>

  <!-- Little Princess Crown on top of the star -->
  <path d="M 220 135 L 230 115 L 244 126 L 256 102 L 268 126 L 282 115 L 292 135 Z" fill="url(#crownGrad)"/>
  <circle cx="256" cy="98" r="5" fill="#FBBF24"/>
  <circle cx="230" cy="112" r="4" fill="#60A5FA"/>
  <circle cx="282" cy="112" r="4" fill="#60A5FA"/>
</svg>
